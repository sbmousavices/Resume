<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سازنده رزومه حرفه‌ای | Behzad Mousavi Tools</title>
    
    <!-- فونت وزیرمتن برای نمایش زیبای متون فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- آیکون‌های FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- کتابخانه تبدیل HTML به PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #d4af37; /* رنگ طلایی برند */
            --dark: #0a1628;
            --light: #f8f9fa;
            --border: #e0e0e0;
            --text: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        body { background-color: var(--light); color: var(--text); display: flex; min-height: 100vh; }

        /* ستون سمت راست: فرم ورودی */
        .editor-panel {
            width: 40%;
            padding: 2rem;
            background: white;
            overflow-y: auto;
            height: 100vh;
            border-left: 1px solid var(--border);
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
        }

        /* ستون سمت چپ: پیش‌نمایش رزومه */
        .preview-panel {
            width: 60%;
            padding: 2rem;
            background: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            height: 100vh;
        }

        h2 { margin-bottom: 1.5rem; color: var(--dark); border-bottom: 2px solid var(--primary); padding-bottom: 0.5rem; display: inline-block; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
        
        input, textarea, select {
            width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px;
            font-family: inherit; transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); outline: none; }
        
        /* ✅ تنظیمات جدید تکست‌اریاها */
        textarea { 
            resize: vertical; /* اجازه تغییر اندازه دستی توسط کاربر */
            min-height: 80px; 
        }

        /* ✅ افزایش اختصاصی ارتفاع باکس سوابق کاری */
        #inp-exp {
            min-height: 200px; 
        }

        .section-title { 
            margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem; 
            color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px;
        }

        /* استایل‌های کاغذ A4 رزومه */
        #resume-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 40px;
            position: relative;
            transform-origin: top center;
        }

        /* دکمه دانلود شناور */
        .btn-download {
            position: fixed; bottom: 30px; left: 30px; z-index: 1000;
            background: var(--primary); color: white; border: none;
            padding: 1rem 2rem; border-radius: 50px; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6); }

        /* تم 1: کلاسیک */
        .theme-classic header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 20px; }
        .theme-classic .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); display: block; margin: 0 auto 15px; }
        .theme-classic h1 { color: var(--dark); font-size: 2rem; }
        .theme-classic .job-title { color: #666; font-size: 1.1rem; margin-bottom: 10px; }
        .theme-classic .contact-info { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; font-size: 0.9rem; color: #555; }
        
        /* تم 2: مدرن (سایدبار) */
        .theme-modern { display: flex; gap: 30px; }
        .theme-modern .sidebar { width: 30%; background: var(--dark); color: white; padding: 20px; border-radius: 10px; }
        .theme-modern .main-content { width: 70%; }
        .theme-modern .profile-img { width: 100%; border-radius: 10px; margin-bottom: 20px; }
        .theme-modern h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
        .theme-modern .sidebar h3 { color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; margin: 20px 0 10px; font-size: 1rem; }
        .theme-modern .main-content h3 { color: var(--dark); border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin: 20px 0 10px; }

        /* تم 3: مینیمال */
        .theme-minimal header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .theme-minimal .profile-img { width: 100px; height: 100px; border-radius: 0; object-fit: cover; }
        .theme-minimal h1 { font-size: 2.2rem; color: var(--dark); letter-spacing: -1px; }
        .theme-minimal .section-title { color: var(--dark); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 30px; border-bottom: 1px solid #ddd; }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 1000px) {
            body { flex-direction: column; }
            .editor-panel, .preview-panel { width: 100%; height: auto; }
            #resume-preview { transform: scale(0.6); transform-origin: top center; margin-bottom: -40%; }
        }
    </style>
</head>
<body>

    <!-- پنل ویرایشگر -->
    <div class="editor-panel">
        <h2><i class="fas fa-pen-fancy"></i> ویرایشگر رزومه</h2>
        
        <div class="form-group">
            <label>انتخاب قالب رزومه:</label>
            <select id="theme-selector" onchange="changeTheme()">
                <option value="theme-classic">کلاسیک و رسمی</option>
                <option value="theme-modern">مدرن و خلاقانه</option>
                <option value="theme-minimal">مینیمال و شیک</option>
            </select>
        </div>

        <div class="section-title"><i class="fas fa-user"></i> اطلاعات فردی</div>
        <div class="form-group"><input type="text" id="inp-name" placeholder="نام و نام خانوادگی" oninput="updateResume()"></div>
        <div class="form-group"><input type="text" id="inp-job" placeholder="عنوان شغلی (مثلا: مدیر پروژه)" oninput="updateResume()"></div>
        <div class="form-group"><input type="email" id="inp-email" placeholder="ایمیل" oninput="updateResume()"></div>
        <div class="form-group"><input type="tel" id="inp-phone" placeholder="شماره تماس" oninput="updateResume()"></div>
        <div class="form-group"><input type="text" id="inp-loc" placeholder="محل سکونت" oninput="updateResume()"></div>
        <div class="form-group">
            <label>وضعیت سربازی:</label>
            <select id="inp-military" onchange="updateResume()">
                <option value="">انتخاب کنید</option>
                <option value="پایان خدمت">پایان خدمت</option>
                <option value="معافیت دائم">معافیت دائم</option>
                <option value="در حال خدمت">در حال خدمت</option>
                <option value="معافیت تحصیلی">معافیت تحصیلی</option>
            </select>
        </div>
        <div class="form-group">
            <label>عکس پرسنلی:</label>
            <input type="file" id="inp-photo" accept="image/*" onchange="loadPhoto(event)">
        </div>

        <div class="section-title"><i class="fas fa-align-right"></i> درباره من</div>
        <div class="form-group"><textarea id="inp-summary" placeholder="خلاصه‌ای کوتاه از توانمندی‌ها و اهداف شغلی..." oninput="updateResume()"></textarea></div>

        <div class="section-title"><i class="fas fa-briefcase"></i> سوابق کاری</div>
        <div class="form-group">
            <!-- ✅ باکس با ارتفاع بیشتر برای راحتی تایپ -->
            <textarea id="inp-exp" placeholder="- عنوان شغلی | نام شرکت | تاریخ شروع - پایان&#10;- توضیح مختصر مسئولیت‌ها و دستاوردها...&#10;- استفاده از کلمات کلیدی مرتبط با صنعت..." oninput="updateResume()"></textarea>
        </div>

        <div class="section-title"><i class="fas fa-graduation-cap"></i> تحصیلات</div>
        <div class="form-group"><textarea id="inp-edu" placeholder="- مقطع تحصیلی | رشته | نام دانشگاه | سال اخذ مدرک" oninput="updateResume()"></textarea></div>

        <div class="section-title"><i class="fas fa-tools"></i> مهارت‌ها و دوره‌ها</div>
        <div class="form-group"><textarea id="inp-skills" placeholder="- Primavera P6&#10;- مدیریت ریسک (EVM)&#10;- طراحی وب (HTML/CSS)&#10;- SEO & Digital Marketing" oninput="updateResume()"></textarea></div>
    </div>

    <!-- پنل پیش‌نمایش -->
    <div class="preview-panel">
        <div id="resume-preview" class="theme-classic">
            <!-- محتوای رزومه توسط جاوااسکریپت پر می‌شود -->
            <header>
                <img src="https://via.placeholder.com/150" id="res-photo" class="profile-img" alt="Profile">
                <h1 id="res-name">نام و نام خانوادگی</h1>
                <div class="job-title" id="res-job">عنوان شغلی</div>
                <div class="contact-info">
                    <span id="res-email"><i class="fas fa-envelope"></i> email@example.com</span>
                    <span id="res-phone"><i class="fas fa-phone"></i> 09120000000</span>
                    <span id="res-loc"><i class="fas fa-map-marker-alt"></i> تهران، ایران</span>
                    <span id="res-military" style="display:none; color:var(--primary); font-weight:bold;"><i class="fas fa-shield-alt"></i> </span>
                </div>
            </header>

            <div class="resume-body">
                <div class="section">
                    <h3 class="section-title">درباره من</h3>
                    <p id="res-summary" style="line-height: 1.8; text-align: justify;">خلاصه‌ای از توانمندی‌های شما اینجا نمایش داده می‌شود...</p>
                </div>

                <div class="section">
                    <h3 class="section-title">سوابق کاری</h3>
                    <div id="res-exp" style="white-space: pre-line; line-height: 1.8;"></div>
                </div>

                <div class="section">
                    <h3 class="section-title">تحصیلات</h3>
                    <div id="res-edu" style="white-space: pre-line; line-height: 1.8;"></div>
                </div>

                <div class="section">
                    <h3 class="section-title">مهارت‌ها و دوره‌ها</h3>
                    <div id="res-skills" style="white-space: pre-line; line-height: 1.8;"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-download" onclick="downloadPDF()">
        <i class="fas fa-file-pdf"></i> دانلود رزومه PDF
    </button>

    <script>
        // تابع به‌روزرسانی زنده رزومه
        function updateResume() {
            document.getElementById('res-name').innerText = document.getElementById('inp-name').value || 'نام و نام خانوادگی';
            document.getElementById('res-job').innerText = document.getElementById('inp-job').value || 'عنوان شغلی';
            
            const email = document.getElementById('inp-email').value;
            document.getElementById('res-email').innerHTML = email ? `<i class="fas fa-envelope"></i> ${email}` : '';
            
            const phone = document.getElementById('inp-phone').value;
            document.getElementById('res-phone').innerHTML = phone ? `<i class="fas fa-phone"></i> ${phone}` : '';
            
            const loc = document.getElementById('inp-loc').value;
            document.getElementById('res-loc').innerHTML = loc ? `<i class="fas fa-map-marker-alt"></i> ${loc}` : '';

            const military = document.getElementById('inp-military').value;
            const milSpan = document.getElementById('res-military');
            if(military) {
                milSpan.style.display = 'inline';
                milSpan.innerHTML = `<i class="fas fa-shield-alt"></i> ${military}`;
            } else {
                milSpan.style.display = 'none';
            }

            document.getElementById('res-summary').innerText = document.getElementById('inp-summary').value || 'خلاصه‌ای از توانمندی‌های شما...';
            document.getElementById('res-exp').innerText = document.getElementById('inp-exp').value;
            document.getElementById('res-edu').innerText = document.getElementById('inp-edu').value;
            document.getElementById('res-skills').innerText = document.getElementById('inp-skills').value;
        }

        // بارگذاری عکس
        function loadPhoto(event) {
            const reader = new FileReader();
            reader.onload = function(){
                document.getElementById('res-photo').src = reader.result;
            };
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        // تغییر تم
        function changeTheme() {
            const theme = document.getElementById('theme-selector').value;
            const preview = document.getElementById('resume-preview');
            preview.className = ''; // حذف کلاس‌های قبلی
            preview.classList.add(theme);
            
            // تنظیم مجدد ساختار HTML برای تم مدرن (سایدبار)
            if(theme === 'theme-modern') {
                preview.innerHTML = `
                    <div class="sidebar">
                        <img src="${document.getElementById('res-photo').src}" id="res-photo" class="profile-img">
                        <h1 id="res-name">${document.getElementById('inp-name').value || 'نام شما'}</h1>
                        <div class="job-title" id="res-job">${document.getElementById('inp-job').value || 'عنوان شغلی'}</div>
                        
                        <h3>تماس</h3>
                        <div id="res-email" style="margin-bottom:5px; font-size:0.9rem;"></div>
                        <div id="res-phone" style="margin-bottom:5px; font-size:0.9rem;"></div>
                        <div id="res-loc" style="margin-bottom:5px; font-size:0.9rem;"></div>
                        <div id="res-military" style="margin-top:10px; font-size:0.9rem; color:var(--primary);"></div>

                        <h3>مهارت‌ها</h3>
                        <div id="res-skills" style="font-size:0.9rem; white-space: pre-line;"></div>
                    </div>
                    <div class="main-content">
                        <div class="section">
                            <h3>درباره من</h3>
                            <p id="res-summary" style="line-height:1.8;"></p>
                        </div>
                        <div class="section">
                            <h3>سوابق کاری</h3>
                            <div id="res-exp" style="white-space: pre-line; line-height:1.8;"></div>
                        </div>
                        <div class="section">
                            <h3>تحصیلات</h3>
                            <div id="res-edu" style="white-space: pre-line; line-height:1.8;"></div>
                        </div>
                    </div>
                `;
            } else {
                // بازگشت به ساختار استاندارد برای کلاسیک و مینیمال
                preview.innerHTML = `
                    <header>
                        <img src="${document.getElementById('res-photo').src}" id="res-photo" class="profile-img">
                        <h1 id="res-name">${document.getElementById('inp-name').value || 'نام شما'}</h1>
                        <div class="job-title" id="res-job">${document.getElementById('inp-job').value || 'عنوان شغلی'}</div>
                        <div class="contact-info">
                            <span id="res-email"></span>
                            <span id="res-phone"></span>
                            <span id="res-loc"></span>
                            <span id="res-military" style="color:var(--primary); font-weight:bold;"></span>
                        </div>
                    </header>
                    <div class="resume-body">
                        <div class="section"><h3 class="section-title">درباره من</h3><p id="res-summary" style="line-height:1.8;"></p></div>
                        <div class="section"><h3 class="section-title">سوابق کاری</h3><div id="res-exp" style="white-space: pre-line; line-height:1.8;"></div></div>
                        <div class="section"><h3 class="section-title">تحصیلات</h3><div id="res-edu" style="white-space: pre-line; line-height:1.8;"></div></div>
                        <div class="section"><h3 class="section-title">مهارت‌ها و دوره‌ها</h3><div id="res-skills" style="white-space: pre-line; line-height:1.8;"></div></div>
                    </div>
                `;
            }
            updateResume(); // فراخوانی مجدد برای پر کردن مقادیر جدید
        }

        // دانلود PDF
        function downloadPDF() {
            const element = document.getElementById('resume-preview');
            const opt = {
                margin:       0,
                filename:     'My_Resume_BehzadMousavi.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
